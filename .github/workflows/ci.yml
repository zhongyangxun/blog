# Run format and lint checks on PRs and pushes
name: ci

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Pin a supported major instead of lts/*: eslint-plugin-astro only
          # allows ^22.22.3 || ^24.16.0 || >=26.3.0 (see package.json engines).
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format (check only)
        run: npm run format:check
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Build
        run: npm run build
